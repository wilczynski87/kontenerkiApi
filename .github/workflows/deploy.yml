name: Deploy to VPS

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: kontenerki

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          cat <<EOF > ~/.ssh/config
          Host vps
            HostName $HOST
            User $USER
            Port $PORT
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
          EOF

      - name: Upload repo to VPS
        run: |
          ssh vps "mkdir -p /opt/app"

          rsync -az --delete --exclude '.git' --exclude '.github' --exclude '.env' ./ vps:/opt/app/ || {
            echo "rsync failed"
            exit 1
          }

      # .env is maintained by hand on the VPS. rsync must not delete it, and this
      # workflow must not rewrite it from GitHub secrets or variables.
      - name: Require manual .env on VPS
        run: |
          ssh vps 'test -s /opt/app/.env' || {
            echo "Brak /opt/app/.env na VPS. Wklej plik ręcznie. Deploy go nie tworzy i nie nadpisuje."
            exit 1
          }

      - name: Build and deploy
        run: |
          ssh vps "
            cd /opt/app
            docker compose down
            docker compose pull
            docker compose build --no-cache
            docker compose up -d
          "